# Local development database only.
# Production uses Neon (or later a dedicated managed Postgres); Vercel is the deploy target.

services:
  db:
    image: postgres:16-alpine
    container_name: maarood-db
    environment:
      POSTGRES_DB: maarood
      POSTGRES_USER: maarood
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maarood -d maarood"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
